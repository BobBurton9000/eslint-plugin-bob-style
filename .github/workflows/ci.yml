name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test:
    name: TypeScript ${{ matrix.typescript-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        typescript-version:
          - 5.9.3
          - 6.0.3
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Select TypeScript version
        run: >-
          npm install --no-save --ignore-scripts --no-audit --no-fund
          typescript@${{ matrix.typescript-version }}

      - name: Build and test
        run: npm test
